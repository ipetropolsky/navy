name: Build & Deploy to GitHub Pages

on:
    push:
        branches: ['master']

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install
              run: npm ci

            # Свой package.json и своя установка: node_modules/firebase-admin и firebase-functions
            # лежат в functions/, а не в корне, и npm ci из корня их не ставит. Без этого шага
            # Check ниже не разрешит 'firebase-admin/app' и подобные импорты в functions/src —
            # ts-check из корня проверяет и этот каталог тоже (см. tsconfig.json).
            - name: Install functions
              run: npm ci --prefix functions

            - name: Check
              run: npm run check

            # Отдельная сборка функций: npm run build ниже собирает только клиентский бандл
            # (vite), а то, что реально уезжает в Cloud Functions, собирает свой tsc со своим
            # tsconfig.json (module: NodeNext) — и без этого шага поломка именно этой сборки
            # осталась бы незамеченной до самого деплоя функций.
            - name: Build functions
              run: npm --prefix functions run build

            # Настройки Firebase приезжают из переменных репозитория (Settings → Secrets and
            # variables → Actions → Variables). Секретами они не назначены нарочно: эти значения
            # всё равно уезжают в бандл к каждому, кто откроет страницу, и прятать их в CI —
            # только делать вид. Переменных нет — сборка выходит на локальном бэкенде, как сейчас.
            - name: Build
              run: npm run build
              env:
                  VITE_BACKEND: ${{ vars.VITE_BACKEND }}
                  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: 'build'

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
